# ---------------------------------------------------------------------------
# NPC 설정
# ---------------------------------------------------------------------------
# 이 설정 파일은 오직 NPC 수정 및 NPC에게 직접적인 영향을 미치는 설정을 위한 것입니다.
# 기본값은 본서버(리테일)와 유사하게 설정되어 있습니다. 이 설정을 변경하면 서버가 본서버 기준에서 벗어나게 됩니다.
# 경고:
# 변경할 때 극도의 주의를 기울여주십시오. 또한 라이브 서버에 적용하기 전에 무엇을 변경하는지 명확히 이해하시기 바랍니다.

# ---------------------------------------------------------------------------
# 일반 설정
# ---------------------------------------------------------------------------

# 마몬의 대장장이/상인의 스폰 위치를 알리는 전체 공지를 띄웁니다.
# 기본값: False
AnnounceMammonSpawn = False

# True - 몬스터가 평화 구역(마을 등)에서도 선공 성향을 유지할 수 있습니다.
# False - 몬스터가 평화 구역에서는 선공 성향을 가질 수 없습니다.
# 기본값: True
AltMobAgroInPeaceZone = True

# NPC를 기본적으로 공격할 수 있는지 여부를 정의합니다.
# 본서버 기준: True
AltAttackableNpcs = True

# GM이 아닌 일반 플레이어가 Shift+클릭을 통해 NPC 스탯을 볼 수 있도록 허용합니다.
# 기본값: False
AltGameViewNpc = False

# 기본값: False
ShowNpcLevel = False

# 기본값: False
ShowNpcAggression = False

# 공격적인 몬스터들이 플레이어의 시체 주변에 캠핑(대기)하지 않도록 합니다.
AttackablesCampPlayerCorpses = False

# 퀘스트가 없는 영지 NPC에게도 혈맹 및 동맹 문장을 표시합니다.
# 기본값: False
ShowCrestWithoutQuest = False

# 커스텀 무작위 인챈트 효과
# 무기를 소지한 모든 NPC가 무작위 무기 인챈트 수치 효과를 얻습니다.
# 인챈트 효과는 시각적일 뿐이며, 범위는 4~21입니다.
# 기본값: False
EnableRandomEnchantEffect = False

# 그라시아 에필로그 규칙이 적용되는 최소 NPC 레벨:
# "캐릭터의 레벨이 레벨 78 이상의 몬스터보다 2레벨 이상 낮으면 몬스터에게 입히는 데미지 양이 감소합니다."
# 참고:
# 이 기능을 비활성화하려면 플레이어 만레벨로 설정하십시오.
# 기본값: 78
MinNPCLevelForDmgPenalty = 78

# -2 레벨 차이부터 -9 레벨 차이까지의 데미지 감소 페널티 비율
# 기본값: 0.8, 0.6, 0.5, 0.42, 0.36, 0.32, 0.28, 0.25
DmgPenaltyForLvLDifferences = 0.8, 0.6, 0.5, 0.42, 0.36, 0.32, 0.28, 0.25
CritDmgPenaltyForLvLDifferences = 0.8, 0.6, 0.5, 0.42, 0.36, 0.32, 0.28, 0.25
SkillDmgPenaltyForLvLDifferences = 0.8, 0.6, 0.5, 0.42, 0.36, 0.32, 0.28, 0.25

# 그라시아 에필로그 규칙이 적용되는 최소 NPC 레벨:
# "캐릭터의 레벨이 몬스터의 레벨보다 3레벨 이상 낮으면 몬스터가 마법 주문을 저항할 확률이 증가합니다."
# 참고:
# 이 기능을 비활성화하려면 플레이어 만레벨로 설정하십시오.
# 기본값: 78
MinNPCLevelForMagicPenalty = 78

# -3 레벨 차이부터 -6 레벨 차이까지의 마법 성공 확률 페널티 비율
# 기본값: 알 수 없음
SkillChancePenaltyForLvLDifferences = 2.5, 3.0, 3.25, 3.5


# ---------------------------------------------------------------------------
# 몬스터 설정
# ---------------------------------------------------------------------------

# 기본 몬스터 시체 유지 시간 (초 단위)입니다.
# 기본값: 7
DefaultCorpseTime = 7

# 스포일(시체 수거) 상태의 시체 유지 시간에 추가될 시간 (초 단위)입니다.
# 기본값: 10
SpoiledCorpseExtendTime = 10

# 시체가 사라지기 전에 시체 흡수 스킬(예: 콥스 메디슨 등)을 사용할 수 있도록 허용되는 시간입니다.
# 기본값: 2000
CorpseConsumeSkillAllowedTimeBeforeDecay = 2000

# 몬스터가 스폰 위치에서 무작위로 이동할 수 있는 최대 거리입니다.
# 기본값: 300
MaxDriftRange = 300

# 몬스터 선공(애그로) 거리 체크 활성화 여부입니다.
# 활성화하면 몬스터가 스폰 위치에서 멀리 끌려갔을 때 인식을 해제하고 돌아갑니다.
# 기본값: True
AggroDistanceCheckEnabled = True

# 몬스터가 스폰 위치에서 최대로 끌려갈 수 있는 거리입니다.
# 스폰 데이터의 chaseRange 매개변수가 있는 경우 이 설정보다 우선 적용됩니다.
# 기본값: 3000
AggroDistanceCheckRange = 3000

# 레이드 보스에게도 최대 선공 거리 체크를 적용할지 여부입니다.
# 안타라스, 발라카스 등의 월드 보스(Grandboss)는 제외됩니다.
# 기본값: True
AggroDistanceCheckRaids = True

# 레이드 보스가 스폰 위치에서 최대로 끌려갈 수 있는 거리입니다.
# 스폰 데이터의 chaseRange 매개변수가 있는 경우 이 설정보다 우선 적용됩니다.
# 기본값: 4000
AggroDistanceCheckRaidRange = 4000

# 인스턴스 던전 내부에서 최대 선공 거리 체크를 적용할지 여부입니다.
# 기본값: False
AggroDistanceCheckInstances = False

# 거리가 너무 멀어져 선공(애그로) 상태가 리셋될 때 몬스터의 HP와 MP를 회복시킵니다.
# 기본값: True
AggroDistanceCheckRestoreLife = True


# ---------------------------------------------------------------------------
# 경비병 설정
# ---------------------------------------------------------------------------

# True - 경비병이 사정거리 내의 선공형(인식) 몬스터를 공격하도록 허용합니다.
# 기본값: False
GuardAttackAggroMob = False


# ---------------------------------------------------------------------------
# 펫 설정
# ---------------------------------------------------------------------------

# 펫의 인벤토리 공간 제한을 제어합니다 (무게 제한이 아님 슬롯 제한).
# 기본값: 12
MaximumSlotsForPet = 12

# 펫의 HP/MP 자연 회복 배율
# 기본값: 100, 100
PetHpRegenMultiplier = 100
PetMpRegenMultiplier = 100


# ---------------------------------------------------------------------------
# 레이드 보스 설정
# ---------------------------------------------------------------------------

# 레이드 보스의 HP 및 MP 회복량 백분율 배율입니다.
# 예시: HP를 10으로 설정하면 레이드 보스의 HP 회복 속도가 일반적인 수준보다 90% 느려집니다.
# 기본값: 100, 100
RaidHpRegenMultiplier = 100
RaidMpRegenMultiplier = 100

# 레이드 보스의 물리 및 마법 방어력 백분율 배율입니다.
# 예시: 10으로 설정하면 방어력이 일반 수준보다 90% 낮아지며,
# 110으로 설정하면 방어력이 일반 수준보다 10% 높아집니다.
# 기본값: 100, 100
RaidPDefenceMultiplier = 100
RaidMDefenceMultiplier = 100

# 레이드 보스의 물리 및 마법 공격력 백분율 배율입니다.
# 예시: 10으로 설정하면 공격력이 일반 수준보다 90% 낮아지며,
# 110으로 설정하면 공격력이 일반 수준보다 10% 높아집니다.
# 기본값: 100, 100
RaidPAttackMultiplier = 100
RaidMAttackMultiplier = 100

# 레이드 보스 리스폰 시간의 최소 및 최대 시간 배율을 설정합니다.
# 기본값은 최소 시간의 경우 12시간 * 1.0이고, 최대 시간의 경우 24시간 * 1.0입니다.
# 예시: RaidMaxRespawnMultiplier를 2로 설정하면 리스폰 사이의 시간이 24시간에서 48시간으로 늘어납니다.
# 기본값: 1.0, 1.0
RaidMinRespawnMultiplier = 1.0
RaidMaxRespawnMultiplier = 1.0

# 레이드 보스의 부하(미니언)들이 리스폰되는 주기를 설정합니다.
# 이 시간은 밀리초(ms) 단위이며, 1분은 60000 밀리초입니다.
# 기본값: 300000
RaidMinionRespawnTime = 300000

# 비표준 고정 리스폰을 가진 부하(미니언)들의 처리를 추가 코딩 없이 오직 설정만으로 쉽게 만듭니다.
# 포맷: 부하ID1,시간(초)1;부하ID2,시간(초)2
CustomMinionsRespawnTime = 22450,30;22371,120;22543,0;25545,0;22424,30;22425,30;22426,30;22427,30;22428,30;22429,30;22430,30;22432,30;22433,30;22434,30;22435,30;22436,30;22437,30;22438,30;25596,30;25605,0;25606,0;25607,0;25608,0

# 레이드 보스(마스터)가 사망 시 스폰되어 있던 부하(미니언)들을 강제로 삭제합니다.
# 기본적으로 부하들은 일반 레이드 보스인 경우에만 사망 시 삭제됩니다.
# 기본값: False
ForceDeleteMinions = False

# 레이드 보스보다 8레벨 이상 높을 때 적용되는 레이드 커스(레이드 저주)를 비활성화합니다.
# 본서버 기준: True
DisableRaidCurse = True

# 레이드 보스와 부하들이 대상(타겟)을 다시 고려하지 않는(바꾸지 않는) 주기를 설정합니다.
# 이 시간은 초 단위이며, 1분은 60초입니다.
# 기본값: 10,10,10
RaidChaosTime = 10
GrandChaosTime = 10
MinionChaosTime = 10


# ---------------------------------------------------------------------------
# 활력 설정
# ---------------------------------------------------------------------------
# 각성 이후 일반 몬스터 처치 시 활력 감소 배율
VitalityConsumeByMob=2250
# 각성 이후 레이드 및 월드 보스 처치 시 활력 증가 배율
VitalityConsumeByBoss=1125