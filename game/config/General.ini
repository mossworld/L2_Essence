# ---------------------------------------------------------------------------
# 일반 서버 설정
# ---------------------------------------------------------------------------
# 기본값은 본서버(Retail)와 유사하게 설정되어 있습니다. 이 설정 중 하나라도 수정하면 서버가 본서버 기준에서 벗어나게 됩니다.
# 경고: 
# 설정을 변경할 때는 각별히 주의하시기 바랍니다. 또한 라이브 서버에 적용하기 전에 본인이 무엇을 변경하는지 정확히 이해하셔야 합니다.

# ---------------------------------------------------------------------------
# 관리자 (GM)
# ---------------------------------------------------------------------------

# 기본 접근 권한 레벨. 예를 들어 100으로 설정하면 모든 유저가 100 레벨의 권한을 가집니다.
# 기본값: 0
DefaultAccessLevel = 100


# True일 경우, GM 권한이 있는 계정만 서버에 접속할 수 있습니다.
# 기본값: False
ServerGMOnly = False

# GM이 로그인할 때 영웅 캐릭터의 빛나는 오라 효과를 가지도록 설정합니다. 
# 참고:
#	GM은 자신에게 직접 "///hero" 명령어를 입력하여 이 오라를 임의로 켤 수 있습니다.
#	그래픽 지연(렉)을 유발할 수 있으므로 비활성화를 권장합니다.
# 기본값: False
GMHeroAura = False

# GM 로그인 시 기본적으로 빌더 숨기기(Builder Hide) 모드로 시작할지 여부입니다.
# 기본값: True
GMStartupBuilderHide = False

# GM 로그인 시 자동으로 무적 상태를 적용합니다.
# 기본값: False
GMStartupInvulnerable = False

# GM 로그인 시 자동으로 은신 상태를 적용합니다.
# 기본값: False
GMStartupInvisible = False

# GM 로그인 시 자동으로 귓속말 거부 상태를 적용합니다.
# 기본값: False
GMStartupSilence = False

# GM 로그인 시 자동으로 GM 목록(/gmlist)에 이름을 등록합니다.
# 기본값: False
GMStartupAutoList = False

# GM 로그인 시 자동으로 다이어트 모드를 적용합니다 (무게 패널티에 영향을 줌).
# 기본값: False
GMStartupDietMode = False

# 아이템 사용 제한을 GM에게도 동일하게 적용합니까? (True = 사용 제한됨)
# 기본값: True
GMItemRestriction = False

# 스킬 사용 제한을 GM에게도 동일하게 적용합니까? (True = 사용 제한됨)
# 기본값: True
GMSkillRestriction = False

# GM이 교환 불가 아이템 및 퀘스트 아이템(드롭 전용)을 바닥에 버리거나 거래할 수 있도록 허용합니다.
# 기본값: False
GMTradeRestrictedItems = False

# GM이 전투 태세(전투 중)일 때도 재시작/종료를 할 수 있도록 허용합니다.
# 기본값: True
GMRestartFighting = False

# GM이 공지사항(Announcement)을 띄울 때 공지 뒤에 GM의 이름을 표시합니다.
# 예시: "Announce: hi (HanWik)"
GMShowAnnouncerName = False

# 모든 GM에게 특별한 스킬을 부여합니다.
# 7029,7041-7064,7088-7096,23238-23249 (마스터의 축복)
# 기본값: False
GMGiveSpecialSkills = False

# 모든 GM에게 특별한 오라 스킬을 부여합니다.
# 7029,23238-23249,23253-23296 (마스터의 축복)
# 기본값: False
GMGiveSpecialAuraSkills = False

# GM 캐릭터의 html 경로를 디버깅합니다.
# 기본값: True
GMDebugHtmlPaths = False

# 본서버 형태의 "//gmspeed" 구현 방식이 마음에 들지 않는 경우,
# 이 설정을 통해 과거 커스텀 L2J 버전의 GM 스피드로 되돌릴 수 있습니다.
# 기본값: False
UseSuperHasteAsGMSpeed = False


# ---------------------------------------------------------------------------
# 서버 보안
# ---------------------------------------------------------------------------

# 로그 저장 설정. 이 설정들을 활성화하면 디스크에 기록되는 로그 데이터의 양이 크게 증가합니다.
# 이로 인해 디스크 사용량이 늘어날 수 있으며, 서버 부하와 플레이어 활동량에 따라 성능에 영향을 줄 수 있습니다.
# 로그 필요성과 서버 용량을 고려하여 이 옵션들을 신중하게 사용하십시오.

# 플레이어의 채팅 메시지 로그를 활성화합니다. 모든 채팅 기록을 남겨야 하는 경우 True로 설정하십시오.
# 기본값: False
LogChat = False

# 아이템 트랜잭션(예: 획득, 거래, 판매 등) 로그를 활성화합니다. 
# 아이템의 이동을 추적하는 데 유용하지만, 유저가 많은 서버에서는 막대한 양의 로그가 생성될 수 있습니다.
# 기본값: False
LogItems = False

# LogItems가 활성화된 경우, 이 값을 True로 설정하면 중요 아이템(특히 아데나 및 착용 가능한 장비 아이템)만 로그에 기록합니다.
# 이를 통해 일반적이고 가치가 낮은 아이템을 제외하여 로그 용량을 줄일 수 있습니다.
# 기본값: False
LogItemsSmallLog = False

# LogItems가 활성화된 경우, 이 값을 True로 설정하면 모든 아이템 대신 지정된 특정 아이템 ID만 로그에 기록합니다.
# 레어 아이템이나 고가치 아이템 등 특정 아이템의 로그만 필요할 때 유용합니다.
# 기본값: False
LogItemsIdsOnly = False

# LogItemsIdsOnly가 활성화되었을 때 로그를 기록할 아이템 ID를 지정합니다.
# 특정 아이템이나 게임 내 재화 등을 추적하려면 아이템 ID를 쉼표(,)로 구분하여 입력하십시오.
# 기본값: 91663 (엘코인)
LogItemsIdsList = 91663

# 아이템 인챈트(강화)와 관련된 모든 행동(성공 또는 실패)의 로그를 활성화합니다.
# 의심스러운 행위를 추적하는 데 도움이 되지만, 인챈트가 빈번하게 이루어지는 경우 거대한 로그 파일이 생성될 수 있습니다.
# 기본값: False
LogItemEnchants = False

# 스킬 인챈트(강화) 및 변경과 관련된 모든 행동의 로그를 활성화합니다.
# 스킬 성장 과정을 모니터링하는 데 유용하지만, 활성화된 서버에서는 광범위한 로그가 발생할 수 있습니다.
# 기본값: False
LogSkillEnchants = False

# 게임 마스터(GM)가 수행한 행동에 대한 감사(Audit) 로그를 활성화합니다.
# 책임 소지를 명확히 하기 위해 관리자 활동을 기록하고 추적하는 데 도움이 됩니다.
# 기본값: False
GMAudit = False

# 플레이어가 허용되지 않은 스킬을 보유하고 있는지 검사합니다.
# 기본값: False
SkillCheckEnable = True

# True일 경우, 유효하지 않은 스킬을 플레이어와 데이터베이스에서 삭제합니다.
# False일 경우, 삭제하지 않고 보고(리포트)만 합니다.
# 기본값: False
SkillCheckRemove = True

# GM 캐릭터도 함께 검사합니다 (SkillCheckEnable = True 일 때만 작동).
# 기본값: True
SkillCheckGM = False

# 멀티셀(Multisell) 거래 시 아이템 수량 제한입니다.
# 클라이언트 허용 최대치: 999999
MultisellAmountLimit = 10000


# ---------------------------------------------------------------------------
# 최적화
# ---------------------------------------------------------------------------

# 바닥에 떨어진 아이템 관리 설정.
# 플레이어가 바닥에 아이템을 버릴 수 있도록 허용합니다.
# 기본값: True
AllowDiscardItem = True

# 바닥에 드롭된 보상 아이템을 지정된 초(seconds) 후에 월드에서 삭제합니다. 0으로 설정하면 비활성화됩니다.
# 기본값: 600
AutoDestroyDroppedItemAfter = 600

# 바닥에 떨어진 허브(Herb) 아이템이 자동으로 소멸되는 시간(초)입니다.
# 기본값: 60
AutoDestroyHerbTime = 60

# 자동으로 삭제되지 않고 보호될 아이템 ID 목록입니다 (57,5575,6673과 같이 쉼표 ","로 구분).
# 참고:
#	목록에 공백(스페이스바)이나 숫자 사이에 빈칸이 포함되지 않도록 하십시오!
#	이 목록에 포함된 아이템들은 아래의 다른 옵션들과 무관하게 항상 보호됩니다.
# 기본값: 0
ListOfProtectedItems = 0

# 게임 서버가 플레이어의 위치 같은 정보를 업데이트(저장)하는 주기(분 단위)입니다.
# 이 숫자를 높게 설정하면 캐릭터 정보 저장 횟수가 줄어들어 데이터베이스 및 하드디스크 접속 부하가 감소합니다.
# 이 숫자를 낮게 설정하면 캐릭터 정보가 더 자주 저장되므로 데이터베이스 및 하드디스크 접속이 빈번해집니다.
# 값을 0으로 설정하면 주기적 저장이 비활성화됩니다.
# 이 설정과 별개로, 캐릭터가 월드를 퇴장할(로그아웃) 때는 항상 저장됩니다.
# 기본값: 15
CharacterDataStoreInterval = 15

# 게임 서버가 혈맹(Clan)의 변수 정보를 데이터베이스에 업데이트하는 주기(분 단위)입니다.
# 이 숫자를 높게 설정하면 혈맹 정보 저장 횟수가 줄어들어 데이터베이스 및 하드디스크 접속 부하가 감소합니다.
# 이 숫자를 낮게 설정하면 혈맹 정보가 더 자주 저장되므로 데이터베이스 및 하드디스크 접속이 빈번해집니다.
# 값을 0으로 설정하면 주기적 저장이 비활성화됩니다.
# 기본값: 15
ClanVariablesStoreInterval = 15

# 캐릭터를 저장할 때만 아이템을 업데이트하도록 설정합니다 (Lazy Update).
# 이 옵션을 켜면 DB 사용량이 크게 줄어들고 서버 성능이 향상됩니다.
# 경고: 이 옵션은 서버가 비정상적으로 다운(크래시)되었을 때 아이템 소실(백섭)을 유발할 수 있습니다.
# 기본값: False
LazyItemsUpdate = False

# 활성화 시, (Lazy Update를 사용 중이더라도) 캐릭터 정보를 저장할 때 해당 캐릭터가 보유한 아이템들도 함께 DB에 강제로 업데이트합니다.
# 기본값: True
UpdateItemsOnCharStore = True

# 플레이어가 바닥에 버린 기타 아이템들도 월드에서 함께 삭제합니다 (착용 가능한 장비 아이템은 제외).
# 참고:
#	AutoDestroyDroppedItemAfter 설정값이 0보다 클 때만 작동합니다.
# 기본값: False
DestroyPlayerDroppedItem = False

# 바닥에 버려진 착용 가능한 장비 아이템(방어구, 무기, 장신구 등)을 삭제합니다.
# 참고:
#	DestroyPlayerDroppedItem = True 일 때만 작동합니다.
# 기본값: False
DestroyEquipableItem = False

# 모든 아이템을 파괴 가능하게 만듭니다.
# 활성화하면 플레이어가 시스템 상의 모든 아이템을 파괴할 수 있게 되므로 주의하십시오!!!
DestroyAllItems = False

# 서버가 재시작된 후 복구할 수 있도록 바닥에 떨어진 아이템 정보를 데이터베이스에 저장합니다.
# 기본값: False
SaveDroppedItem = False

# 데이터베이스에 저장되어 있던 드롭 아이템들을 메모리로 로드한 후, 해당 DB 테이블을 비울지 여부입니다 (안전 설정).
# 아이템을 다시 저장하기 전에 서버가 다운되면, 다음 시작 시 예전 아이템들이 다시 복구되는데, 플레이어가 이미 그중 일부를 주웠을 수 있으므로 아이템 복사를 방지하는 역할을 합니다.
# 기본값: False
EmptyDroppedItemTableAfterLoad = False

# 바닥에 있는 아이템들을 DB에 저장하는 시간 주기(분 단위)입니다. 0으로 설정하면 비활성화됩니다.
# 참고:
#	SaveDroppedItemInterval을 비활성화하면, 아이템은 서버가 정상 종료될 때만 데이터베이스에 저장됩니다.
# 기본값: 60
SaveDroppedItemInterval = 60

# 다음 서버 재시작 시 데이터베이스에 저장된 모든 드롭 아이템을 삭제하겠습니까?
# 참고:
#	SaveDroppedItem = False 일 때만 작동합니다.
# 기본값: False
ClearDroppedItemTable = False

# NPC의 퀘스트 링크 목록을 퀘스트 ID(QuestId) 순서로 정렬합니다.
# 본서버 기준: False (하지만 정렬 안 되면 보기에 지저분함)
OrderQuestListByQuestId = True

# 플레이어에게서 유효하지 않은 퀘스트 정보를 삭제합니다.
# 기본값: False
AutoDeleteInvalidQuestData = True

# 스토리 퀘스트를 완료했을 때 플레이어에게 경험치 부스트 버프 보상을 부여합니다.
# 본서버 기준: True
StoryQuestRewardBuff = True

# 겹치지 않는(비중첩성) 아이템을 한 번에 여러 개 제작할 수 있도록 허용합니까?
# 기본값: True
MultipleItemDrop = True

# html 캐싱 기능의 활성화/비활성화 설정입니다.
# True = 서버 시작 시 모든 html 파일을 캐시 메모리에 로드합니다.
# False = 해당 html 파일이 처음 요청될 때만 캐시 메모리에 로드합니다.
# 라이브 서버 추천: True
# 개발용 서버 추천: False
HtmCache = False

# html 파일에 ASCII 코드가 아닌 문자(예: 한글 등)가 포함되어 있는지 인코딩을 체크합니다.
# 기본값 = True
CheckHtmlEncoding = True

# NPC 애니메이션 지연 시간의 최소 및 최대 가변 값(초 단위)입니다.
# MinNpcAnimation 값은 반드시 MaxNpcAnimation 값보다 작거나 같아야 합니다.
# 무작위 애니메이션을 끄려면 값을 0으로 설정하십시오.
# 기본값: 5
MinNpcAnimation = 5
# 기본값: 60
MaxNpcAnimation = 60
# 기본값: 5
MinMonsterAnimation = 5
# 기본값: 60
MaxMonsterAnimation = 60

# 그리드(Grid) 옵션: 그리드는 스스로 활성화되거나 비활성화될 수 있습니다. 이는 해당 그리드 영역 내의 모든 AI 태스크 및 (향후) 지오데이터(Geodata)의 로딩과 처리에 영향을 미칩니다.
# 유저가 그리드에 진입하면 즉시 활성화되며, 지정된 초(seconds)를 바탕으로 인접한 8개의 주변 그리드도 함께 활성화됩니다.
# 그리드와 그 주변 영역에 플레이어가 단 한 명도 존재하지 않는 상태로 지정된 초가 지나면 해당 그리드 및 인접 그리드가 비활성화됩니다.
# 'Always On' 옵션을 사용하면 이 모든 과정을 무시하고 모든 그리드를 항상 활성화 상태로 둡니다 (권장하지 않음).
# 기본값: False
GridsAlwaysOn = False

# 기본값: 1
GridNeighborTurnOnTime = 1

# 기본값: 90
