# ---------------------------------------------------------------------------
# 게임 서버 설정
# ---------------------------------------------------------------------------
# 이 파일은 서버 구성 설정 파일입니다. 여기에서 서버의 연결 정보를 설정할 수 있습니다.
# 이 설정은 사용자가 공유기(라우터) 뒤에 환경을 구축했다는 가치 하에 작성되었습니다.
# 아주 쉬운 용어 정의...
# LAN (로컬 영역 네트워크) - 일반적으로 사용자 본인과 동일한 공유기에 연결된 컴퓨터들로 구성됩니다.
# WAN (광역 네트워크) - 일반적으로 공유기 외부(즉, 인터넷 환경)의 컴퓨터들로 구성됩니다.
# x.x.x.x - IP 주소의 형식입니다. 설정에 x 문자를 그대로 넣지 마십시오. 반드시 실제 숫자여야 합니다.

# ---------------------------------------------------------------------------
# 네트워크 설정
# ---------------------------------------------------------------------------

# 이 게임 서버가 연결할 로그인 서버의 주소입니다.
# 경고: <u><b><font color="red">무엇을 하는지 정확히 모른다면 여기의 기본 IP를 변경하지 마십시오!</font></b></u>
# 경고: <u><b><font color="red">외부/내부 IP 설정은 이제 "ipconfig.xml" 파일 내부에서 이루어집니다.</font></b></u>
# 기본값: 127.0.0.1
LoginHost = 127.0.0.1

# 로그인 서버가 게임 서버의 연결 요청을 대기(리스닝)하는 TCP 포트입니다.
# 기본값: 9014
LoginPort = 9014

# 게임 서버의 바인드 주소입니다. 대부분의 경우 이 설정을 변경할 필요가 없습니다.
# 경고: <u><b><font color="red">무엇을 하는지 정확히 모른다면 여기의 기본 IP를 변경하지 마십시오!</font></b></u>
# 경고: <u><b><font color="red">외부/내부 IP 설정은 이제 "ipconfig.xml" 파일 내부에서 이루어집니다.</font></b></u>
# 기본값: * (0.0.0.0)
GameserverHostname = 0.0.0.0

# 기본값: 7777
GameserverPort = 7777

# 패킷 암호화 여부입니다.
# 기본적으로 송수신되는 패킷은 Blowfish 알고리즘을 사용하여 암호화됩니다.
# 이 기능을 비활성화하면 전송되는 패킷을 처리하는 데 필요한 리소스가 줄어들며,
# 브로드캐스트(전체 전송)되는 패킷을 각 클라이언트에 보낼 때마다 재암호화할 필요가 없어집니다.
# 본서버 기준: True
PacketEncryption = False


# ---------------------------------------------------------------------------
# 기타 서버 설정
# ---------------------------------------------------------------------------

# 게임 서버가 요청할 서버 ID입니다.
# 예시: 1 = 바츠(Bartz)
# 기본값: 1
RequestServerID = 1

# True = 요청한 서버 ID가 이미 사용 중인 경우, 로그인 서버가 이 서버에 다른 ID를 부여하도록 허용합니다.
# 기본값: True
AcceptAlternateID = True

# 데이타팩(Datapack)의 루트 디렉토리입니다.
# 아래 라인의 주석을 해제하지 않는 한, 서버가 시작된 현재 디렉토리가 기본값으로 지정됩니다.
# 경고: <u><b><font color="red">지정된 경로가 올바르지 않으면 여러 가지 오류가 발생할 수 있습니다!</font></b></u>
# 기본값: .
DatapackRoot = .

# 스크립트 루트 디렉토리입니다.
ScriptRoot = ./data/scripts

# 서버에 동시에 접속하여 플레이할 수 있는 최대 플레이어 수를 정의합니다.
# 기본값: 2000
MaximumOnlineUsers = 2000

# 서버가 접속을 허용하는 프로토콜 버전 리비전 목록입니다.
# 구분 기호는 세미콜론(;)입니다.
# 경고: <u><b><font color="red">프로토콜 리비전을 변경하면 통신 호환성 문제가 발생하여 게임 내에서 많은 오류가 발생할 수 있습니다!</font></b></u>
# Samurai Crow: 542
AllowedProtocolRevisions = 542

# 캐릭터 선택 창에서 서버 이름 옆에 표시될 서버 타입을 지정합니다.
# 참고:
#	사용 가능한 값: Normal, Relax, Test, Broad, Restricted, Event, Free, World, New, Classic, Essence, Eva
# 기본값: Essence
ServerListType = Essence

# 캐릭터 선택 창에서 서버 이름 옆에 표시될 서버의 제한 연령을 지정합니다.
# 참고:
#	사용 가능한 값: 0, 15, 18
# 기본값: 0
ServerListAge = 0

# 서버 리스트 표기 설정입니다.
# 캐릭터 선택 창에서 서버 이름 앞에 대괄호 []를 표시합니다.
# 기본값: False
ServerListBrackets = False


# ---------------------------------------------------------------------------
# 데드락 와쳐 (데드락 감지를 위한 별도 스레드)
# ---------------------------------------------------------------------------
# 활성화 시 데드락(교착 상태) 발생 상황에서 향상된 크래시 로그 기록 및 자동 재시작을 수행합니다.
# 체크 주기 단위는 초 단위입니다.
# 기본값: True
DeadlockWatcher = True

# 기본값: 20
DeadlockCheckInterval = 20

# 기본값: False
RestartOnDeadlock = False


# ---------------------------------------------------------------------------
# 플레이어 HWID(하드웨어 ID) 설정
# ---------------------------------------------------------------------------

# 로그인 시 하드웨어 정보가 전송되는지 체크합니다.
# 경고: 클라이언트로부터 하드웨어 정보를 수신하려면 l2.ini의 NetSendHardWare 설정이 true로 되어 있어야 합니다.
# 기본값: False
EnableHardwareInfo = False

# 하드웨어 정보가 없는 플레이어들을 게임에서 추방(킥)합니다.
# MaxPlayersPerHWID 값이 0보다 크면 자동으로 True로 설정됩니다.
# 기본값: False
KickMissingHWID = False

# HWID(하드웨어 ID)당 게임에 입장할 수 있는 최대 플레이어 수입니다.
# 기본값: 0 (무제한)
MaxPlayersPerHWID = 0


# ---------------------------------------------------------------------------
# 기타 플레이어 설정
# ---------------------------------------------------------------------------

# 캐릭터 이름 규칙 템플릿입니다.
# 예시:
# CnameTemplate = [A-Z][a-z]{3,3}[A-Za-z0-9]*
# 위 설정은 첫 글자는 대문자, 다음 세 글자는 소문자, 그 뒤로는 대소문자 구분 없는 문자나 숫자를 허용합니다 (예: OmfgWTF1)
# CnameTemplate = [A-Z][a-z]*
# 위 설정은 첫 글자만 대문자이고 나머지는 소문자인 문자만 허용합니다 (예: Omfgwtf)
# 기본값 .* (모든 기호/문자 허용)
CnameTemplate = .*

# 플레이어가 자신의 펫에게 지어줄 수 있는 이름을 제한하는 설정입니다.
# 자세한 내용은 CnameTemplate을 참조하십시오.
PetNameTemplate = .*

# 플레이어가 설정할 수 있는 혈맹/동맹 이름을 제한하는 설정입니다.
# 자세한 내용은 CnameTemplate을 참조하십시오.
ClanNameTemplate = .*

# 계정당 생성 가능한 최대 캐릭터 수입니다.
# 기본값: 7 (클라이언트 제한 수치)
CharMaxNumber = 7


# ---------------------------------------------------------------------------
# 예방 차원의 서버 재시작 설정
# ---------------------------------------------------------------------------

# CPU 또는 메모리 사용량이 너무 높을 때 서버를 자동으로 재시작하는 기능을 활성화합니다.
# 기본값: False
PrecautionaryRestartEnabled = False

# 시스템 CPU 사용량 모니터링을 활성화합니다.
# 기본값: True
PrecautionaryRestartCpu = True

# 프로세스 메모리 사용량 모니터링을 활성화합니다.
# 기본값: False
PrecautionaryRestartMemory = False

# 공성전이 진행 중이거나, 플레이어가 올림피아드/이벤트/인스턴스 던전에 있거나,
# 레이드 보스를 타겟팅하고 있는지 체크하여 재시작을 보류합니다.
# 기본값: True
PrecautionaryRestartChecks = True

# 사용할 리소스의 임계치 백분율(%)입니다.
# 기본값: 95
PrecautionaryRestartPercentage = 95

# 각 체크 주기 사이의 대기 시간(초 단위)입니다.
# 기본값: 60
PrecautionaryRestartDelay = 60


# ---------------------------------------------------------------------------
# 정기(예약) 서버 재시작 설정
# ---------------------------------------------------------------------------

# 정기적인 서버 재시작 일정을 활성화합니다.
# 기본값: False
ServerRestartScheduleEnabled = False

# 플레이어가 게임에 입장할 때 재시작 안내 메시지를 전송합니다.
# 기본값: False
ServerRestartScheduleMessage = False

# 재시작 전 카운트다운 시간입니다 (초 단위).
# 기본값: 600 (10분)
ServerRestartScheduleCountdown = 600

# 정기 재시작 일정 시간 설정입니다.
# 쉼표(,)를 사용하여 하나 이상의 값을 지정할 수 있습니다.
# 예시: 12:00, 00:00
ServerRestartSchedule = 08:00

# 재시작이 수행될 요일을 지정합니다. 값은 쉼표(,)로 구분합니다.
# 예시: 1,2,3,4,5,6,7 (일,월,화,수,목,금,토)
# 기본값: 4 (수요일)
ServerRestartDays = 4