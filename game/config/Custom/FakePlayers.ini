# ---------------------------------------------------------------------------
# 페이크 플레이어 (가짜 유저/봇) 설정
# ---------------------------------------------------------------------------
# 저희 페이크 플레이어 시스템은 기존 NPC 시스템을 활용하므로, 가짜 유저들이
# 서버 성능에 최소한의 영향만 주면서 NPC처럼 원활하게 작동할 수 있도록 합니다.

# 페이크 플레이어 시스템을 활성화합니다.
EnableFakePlayers = False

# 페이크 플레이어와의 채팅 기능을 활성화합니다.
FakePlayerChat = True

# 페이크 플레이어가 정령탄/마정탄(숏)을 사용할 수 있도록 활성화합니다.
FakePlayerUseShots = True

# 페이크 플레이어를 처치했을 때 PvP 킬 보상을 적용합니다.
FakePlayerKillsRewardPvP = True

# 보라색 상태(unflagged)가 아닌 페이크 플레이어를 처치했을 때 카르마(성향치) 규칙을 적용합니다.
FakePlayerUnflaggedKillsKarma = True

# PvP 플래깅(보라색 상태 선공) 없이도 페이크 플레이어를 공격할 수 있도록 설정합니다.
FakePlayerAutoAttackable = False

# 선공형 AI를 가진 페이크 플레이어가 주변 몬스터를 공격하도록 설정합니다.
FakePlayerAggroMonsters = True

# 선공형 AI를 가진 페이크 플레이어가 주변 실제 플레이어를 공격하도록 설정합니다.
FakePlayerAggroPlayers = False

# 선공형 AI를 가진 페이크 플레이어가 주변의 다른 페이크 플레이어를 공격하도록 설정합니다.
FakePlayerAggroFPC = False

# 페이크 플레이어가 몬스터를 사냥할 때 아이템을 드롭할 수 있도록 설정합니다.
FakePlayerCanDropItems = True

# 페이크 플레이어가 바닥에 떨어진 아이템을 주울 수 있도록 설정합니다.
FakePlayerCanPickup = True