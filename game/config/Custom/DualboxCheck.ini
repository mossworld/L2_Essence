# ---------------------------------------------------------------------------
# 투클라이언트(듀얼박스) 체크 설정
# ---------------------------------------------------------------------------

# IP 주소당 게임에 입장할 수 있는 최대 플레이어 수입니다.
# 기본값: 0 (무제한)
DualboxCheckMaxPlayersPerIP = 0

# IP 주소당 올림피아드에 참여할 수 있는 최대 플레이어 수입니다.
# 기본값: 0 (무제한)
DualboxCheckMaxOlympiadParticipantsPerIP = 0

# IP 주소당 L2J 이벤트 엔진(//event)을 사용하는 이벤트에 참여할 수 있는 최대 플레이어 수입니다.
# 기본값: 0 (무제한)
DualboxCheckMaxL2EventParticipantsPerIP = 0

# IP 주소당 오프라인 플레이(개인상점 등)를 허용할 최대 플레이어 수입니다.
# 기본값: 0 (무제한)
DualboxCheckMaxOfflinePlayPerIP = 0

# IP 주소당 프리미엄(유료) 플레이어가 오프라인 플레이를 할 수 있는 최대 플레이어 수입니다.
# 기본값: 0 (무제한)
DualboxCheckMaxOfflinePlayPremiumPerIP = 0

# 오프라인 상점을 열고 있는 캐릭터를 투클라이언트(듀얼박스) 제한 수치에 포함할지 여부입니다.
# 기본값: False
DualboxCountOfflineTraders = False

# 투클라이언트 체크를 제외하거나 예외를 둘 IP/도메인 화이트리스트 목록입니다.
# 포맷: 주소1,추가할개수1;주소2,추가할개수2...
# 네트워크 주소는 숫자 형식(127.0.0.1)이나 도메인 문자열(localhost) 형식 모두 가능합니다.
# 여기에 지정한 숫자는 위의 글로벌 제한 수치에 추가로 더해집니다.
# 예를 들어, IP당 TvT 이벤트 참여 제한이 1개(투클라 금지)로 설정되어 있고,
# 화이트리스트에 "l2jmobius.org,2"를 등록하면 l2jmobius.org 주소에서 참여 가능한 인원은 1+2=3명이 됩니다.
# 무제한 연결을 허용하려면 0 또는 음수 값을 사용하십시오.
# 기본값: 127.0.0.1,0 (로컬호스트에서의 접속은 무제한)
DualboxCheckWhitelist = 127.0.0.1,0