# ---------------------------------------------------------------------------
# 외형 변경(형상변환) 시스템 설정
# ---------------------------------------------------------------------------
# 외형 변경 시스템은 사용자의 방어구 및 무기의 외형을
# 다른 아이템의 외형으로 대체할 수 있는 기능을 제공합니다.
# 획득한 모든 아이템은 외형 변경 컬렉션에 추가됩니다.
# 이 시스템은 줌지(Zumzi, 900009) NPC를 통해 이용할 수 있습니다.

# 외형 변경 시스템 활성화/비활성화 여부입니다.
TransmogEnabled = False

# 동일 계정 내에서 외형 변경 컬렉션을 공유하도록 설정합니다.
TransmogShareAccount = False

# 외형 변경 적용 시 소모되는 아데나 비용입니다.
TransmogApplyCost = 0

# 외형 변경 해제(원래대로 복구) 시 소모되는 아데나 비용입니다.
TransmogRemoveCost = 0

# 외형 변경에 추가할 수 없는 제한 아이템 ID 목록이며, 쉼표로 구분합니다.
TransmogBannedItemIds =