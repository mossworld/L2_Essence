# ---------------------------------------------------------------------------
# 이 속성 파일은 플레이어에게 직접적인 영향을 미치는 구성 설정을 위한 것입니다.
# 기본값은 공식 서버(Retail)와 유사하게 설정되어 있습니다. 
# 이 설정 중 하나라도 수정하면 서버가 공식 서버의 사양에서 벗어나게 됩니다.
# 경고: 
# 설정을 변경할 때는 각별히 주의하십시오. 또한 실제 라이브 서버에 적용하기 전에 
# 자신이 무엇을 변경하는지 정확히 이해해야 합니다.

# ---------------------------------------------------------------------------
# 통계 및 수치 (Statistics)
# ---------------------------------------------------------------------------

# 캐릭터가 사망하여 경험치를 잃었을 때, 현재 경험치가 해당 레벨의 요구치보다 낮아질 경우 
# 레벨 다운(강등)을 강제로 적용할지 여부입니다. 
# False로 설정하면 사망 후 경험치가 부족해도 레벨이 내려가지 않습니다.
# 기본값: True
Delevel = True

# 플레이어가 이 레벨 이후부터 레벨 다운의 영향을 받습니다.
# 클래식 기본값: 9
DelevelMinimum = 9

# 레벨 다운 시 모든 플레이어 스킬의 레벨을 체크하는 옵션입니다.
# 플레이어 레벨이 스킬 습득 레벨보다 9단계 이상 낮아지면, 스킬 레벨이 가능한 다음 단계로 낮아집니다.
# 만약 가능한 레벨이 없다면 해당 스킬은 플레이어에게서 삭제됩니다.
DecreaseSkillOnDelevel = True

# 무게 제한 배수입니다. 예: 5로 설정하면 일반 무게 제한의 5배를 부여합니다.
# 기본값: 1
AltWeightLimit = 1

# 이동 속도 보정치입니다. 예: 5로 설정하면 플레이어의 달리기 속도에 +5를 더합니다.
# 기본값: 0
RunSpeedBoost = 0

# 캐릭터 부활 시 회복되는 HP, MP, CP의 백분율(%)입니다.
# 0으로 설정하면 회복 기능을 비활성화합니다.
# 기본값: 0, 65, 0
RespawnRestoreCP = 0
RespawnRestoreHP = 65
RespawnRestoreMP = 0

# 플레이어의 HP, MP, CP 재생(회복)률 배수입니다.
# 예: HP를 10으로 설정하면 플레이어의 HP 재생 속도가 일반보다 90% 느려집니다.
# 기본값: 100, 100, 100
