# 기본값: False
DisableTutorial = False

# 첫 로그인 버프 활성화 여부입니다.
# 기본값: True
EnableFirstLoginBuffs = True

# 플레이어는 클라이언트에서 자신의 키 매핑을 정의할 수 있으며 저장하려면 서버 측에 저장되어야 합니다.
# 기본값: True
StoreCharUiSettings = True

# 캐릭터 이름 제한
# 캐릭터가 단어를 포함하는 이름을 가지지 못하도록 합니다.
# 쉼표로 구분합니다. 예: announcements,announce...
ForbiddenNames = annou,ammou,amnou,anmou,anou,amou

# 활성화하면 침묵 모드(PM 수신 차단)에 있는 캐릭터가 다른 캐릭터에게 PM을 보낼 때 침묵 모드는 더 이상 이 캐릭터를 차단하지 않습니다.
# 이를 통해 두 캐릭터 모두 침묵 모드가 활성화된 경우에도 PM을 보낼 수 있습니다.
# 제외 목록은 캐릭터가 침묵 모드로 들어갈 때마다 지워집니다.
SilenceModeExclude = False

# ---------------------------------------------------------------------------
# 능력치 설정:
# ---------------------------------------------------------------------------

# 캐릭터가 가질 수 있는 최대 능력 포인트입니다.
# Classic: 0
AbilityMaxPoints = 0

# 사용된 능력 포인트를 초기화하기 위해 필요한 아데나입니다.
# 기본값: 10000000
AbilityPointsResetAdena = 10000000