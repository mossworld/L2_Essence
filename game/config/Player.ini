# 파티 경험치 분배
# "자동 방법"을 사용하면 멤버의 공유가 파티 보너스(2인 파티의 경우 30%)보다 낮을 때 경험치/SP 분배에서 제거됩니다.
# 이 경우 파티에서 경험치/SP를 받지 못하며 파티 보너스로 계산되지 않습니다.
# 파티 멤버의 경험치 분배에 대한 컷오프 포인트를 원하지 않으면 첫 번째 옵션을 "none"으로 설정합니다.
# 가능한 옵션: auto, level, percentage, highfive, none
# Classic: highfive
PartyXpCutoffMethod = highfive

# "percentage" 방법이 선택될 때 이 옵션이 적용됩니다. 이 옵션에 높은 값을 사용하지 마세요!
# 기본값: 3.0
PartyXpCutoffPercent = 3.0

# "level" 방법이 선택될 때 이 옵션이 적용됩니다. 낮은 값을 사용하지 마세요!
# Classic: 15
PartyXpCutoffLevel = 15

# "highfive" 방법이 선택될 때 이 옵션이 적용됩니다.
# 각 숫자 쌍은 레벨 범위를 나타냅니다.
# 간격이 첫 번째 쌍 사이에 있으면 페널티가 없습니다.
# 간격이 두 번째 쌍 사이에 있으면 가장 낮은 파티 멤버는 다른 사람이 받는 경험치의 30%만 받습니다.
# 간격이 마지막 쌍 사이에 있으면 가장 낮은 파티 멤버는 경험치를 받지 않습니다.
# 기본값: 0,9;10,14;15,99
PartyXpCutoffGaps = 0,9;10,14;15,99

# "highfive" 방법이 선택될 때 이 옵션이 적용됩니다.
# 각 숫자는 해당 레벨 간격에서의 경험치 비율 획득을 나타냅니다.
# 첫 번째 간격에서 가장 낮은 파티 멤버는 페널티가 없으므로 100% 경험치를 얻습니다.
# 두 번째 간격에서 가장 낮은 파티 멤버는 다른 사람이 받는 경험치의 30%만 받습니다.
# 마지막 간격에서 가장 낮은 파티 멤버는 경험치를 받지 않습니다.
# 기본값: 100;30;0
PartyXpCutoffGapPercent = 100;30;0

